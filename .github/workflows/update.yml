name: Atualizar screener

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 em Brasília (UTC-3), dias úteis, depois do fechamento
  workflow_dispatch:           # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ["screener/**", "docs/**", "config.json", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes do motor (não bloqueiam a publicação)
        continue-on-error: true
        run: python -m pytest -q tests

      - name: Rodar o screener com dados reais
        run: python -m screener.run

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
